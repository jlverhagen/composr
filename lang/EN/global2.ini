[strings]
DB_MANIFEST_DESCRIPTION_autosave=Stores unsaved form data in case of browser crashes, retrieved by AJAX (autosave is deleted on a successful save)
DB_MANIFEST_DESCRIPTION_cache=Various cached data (e.g., blocks); used when persistent cache engines are unavailable or disabled
DB_MANIFEST_DESCRIPTION_cache_on=Determines how we cache data for things (e.g., blocks)
DB_MANIFEST_DESCRIPTION_cron_progression=Tracks the status and configuration of system scheduler hooks
DB_MANIFEST_DESCRIPTION_post_tokens=A record of CSRF tokens, usually for form submissions and POST requests to prevent Cross-Site Request Forgery
DB_MANIFEST_DESCRIPTION_db_meta=Stores a map of database table columns to their software types
DB_MANIFEST_DESCRIPTION_db_meta_indices=Stores a list of indexes for the database
DB_MANIFEST_DESCRIPTION_db_meta_foreign_keys=Stores database table column relation maps for use in foreign key constraints and data integrity
DB_MANIFEST_DESCRIPTION_failedlogins=A log of all failed logins (used for brute force detection)
DB_MANIFEST_DESCRIPTION_incoming_uploads=Temporary storage of uploaded file metadata, before main form submission
DB_MANIFEST_DESCRIPTION_daily_visits=Tracks daily visits from site members so we know when to perform daily login operations (e.g., daily points)
DB_MANIFEST_DESCRIPTION_member_tracking=Tracks what page each user is viewing and when (for auditing and statistics)
DB_MANIFEST_DESCRIPTION_messages_to_render=Stores messages that have been queued up for display on a members browser (e.g., if they have just been redirected after completing something, so a status message will be queued for display after they've been redirected)
DB_MANIFEST_DESCRIPTION_modules=Registry of all installed modules, including the version that was installed (used for auto-upgrading)
DB_MANIFEST_DESCRIPTION_rating=Stores ratings (rating_for_type determines what kind of content, rating_for_id determines what ID of content within that type)
DB_MANIFEST_DESCRIPTION_review_supplement=Stores reviews (complex ratings)
DB_MANIFEST_DESCRIPTION_sessions=Stores session IDs and information for all users (mainly used to persist logins and to validate session IDs against IP addresses)
DB_MANIFEST_DESCRIPTION_trackbacks=Stores trackbacks from other sites and blogs
DB_MANIFEST_DESCRIPTION_translate=On sites with content translations enabled, TRANS fields will contain an integer. The integer maps to a row in this table containing the actual processed text in the various languages available.
DB_MANIFEST_DESCRIPTION_translation_cache=Stores a cache of translated content (mainly when using third-party services such as Google Translate)
DB_MANIFEST_DESCRIPTION_tutorial_links=Stores a cache of which software tutorials apply to which pages
DB_MANIFEST_DESCRIPTION_unbannable_ip=Maintains a list of IP addresses which have been configured to never be banned
DB_MANIFEST_DESCRIPTION_values=Arbitrary storage of short, common data values (mapping of keys to values); these are often loaded up in bulk on a page load
DB_MANIFEST_DESCRIPTION_values_elective=Arbitrary store of longer or less-common data values (mapping of keys to values); these are only loaded in individually as needed
DB_MANIFEST_DESCRIPTION_ft_index_commonality=Search indexing keyword stats (for determining ranks and stop words)
