[strings]
BAYES_ANTISPAM=Bayes antispam
MODULE_TRANS_NAME_admin_antispam=Bayes antispam
DOC_BAYES_ANTISPAM=The Bayes antispam system is a Bayesian machine learning algorithm which helps identify and deal with spam content. The model trains your site's content which is 7 or more days old as ham (not spam). And when deleting content or warning someone, you have the option to train the content as spam. When a member tries to submit content, the model makes a prediction of how likely it is spam based on the trained data. And you can use that prediction in the software's antispam heuristics to mark for validation, block, or ban the content. The model is fully GDPR compliant as all training data is hashed and salted.

BAYES_ANTISPAM_SMOOTHING=Bayes antispam smoothing factor
CONFIG_OPTION_antispam_bayes_smoothing=Controls how cautiously the Bayes antispam prediction treats rare words. Use a value between 0 and 1. Lower values make predictions more closely resembling the specific spam on which the model has been trained, but it may fail to flag more broad spam. Higher values allow it to flag more broad spam it may not have specifically been trained on, but it increases the risk of false-positives.

HAM_TRAINING=Ham training

DESCRIPTION_PRIVACY_BAYES_ANTISPAM=This data relates to the Bayes antispam model which helps predict if something someone is submitting is spam.
PRIVACY_ACTION_bayes_antispam=Content you submit to our site may be trained on a local Bayes machine learning algorithm.
PRIVACY_REASON_bayes_antispam=This helps us identify attempts to submit spam content on our site.
PRIVACY_ACTION_BAYES_ANTISPAM_POSITIVE=We use a local Bayes machine larning algorithm to help us reduce spam content on the site. The algorithm automatically trains on most textual site content 7 or more days old (as not spam). Content deleted for spam reasons will immediately be trained as spam. The stored training data is fully compliant with privacy regulations; it is hashed and salted (SHA-256) so it is virtually impossible to identify the original text or from where it came. The caveat is that we cannot directly purge data from the algorithm. But when content of yours is deleted (except when flagged as spam), the site un-trains the content from the algorithm to the best of its ability. Consider trained data permanent otherwise.
