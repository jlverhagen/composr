[strings]
MODULE_TRANS_NAME_tracker=Tracker

TRACKER=Tracker

MANTIS_TRACKER_PAGE_TITLE=Open tracker issues
MANTIS_TRACKER_PAGE_TEXT=This page lists the open issues on our bug and feature tracker. They are ordered according to the number of points sponsored on them; those who implement and resolve the issue will receive the sponsored points (plus a standard 25 points for resolving the issue).
POINTS_SPONSORED={1} {1|point|points}
SUGGESTED_TOTAL_SPONSORSHIP=Suggested sponsorship: {1} {1|point|points}
ISSUE_REPORTER=Reported by {1} {2}
ISSUE_FULL_DETAILS=View/comment/sponsor issue
ISSUE_COMMENTS={1} {1|bugnote (comment)|bugnotes (comments)}

FIELD_TYPE_tracker_id=A read-only auto-incrementing numeric identifier
FIELD_TYPE_addon=An addon
FIELD_TYPE_version=A software version

TRACKER_CATALOGUE_NOTES=Points are awarded when an issue is resolved to the submitter and handler. Additionally, sponsorships are resolved accordingly.
DESCRIPTION_TRACKER_CATALOGUE=This is the the software tracker. Here, you can report issues with the software and suggest features. You can also discuss your thoughts on proposed changes. You can sponsor an issue with your points to incentivise implementation. Or, if you have developer knowledge, you can implement issues yourself by [url="{$CMS_REPOS_URL@}"]cloning our GitLab repository[/url], creating a branch, implementing the issue, and finally making a merge request.
DESCRIPTION_TRACKER_CATALOGUE_TITLE=Describe your issue or suggestion in one concise title. Be specific! E.g., instead of saying "catalogues do not work", say "adding a catalgue results in a PHP out of memory error."
DESCRIPTION_TRACKER_CATALOGUE_IDENTIFIER=This is the universal identifier for this issue.
ISSUE_TYPE=Issue type
DESCRIPTION_TRACKER_CATALOGUE_ISSUE_TYPE=Choose the most appropriate issue type.
TRACKER_CATALOGUE_ISSUE_TYPE_DEFAULT=feature|trivial|minor|major|security
TRACKER_CATALOGUE_ISSUE_TYPE_DEFAULT_feature=Feature request or suggestion
TRACKER_CATALOGUE_ISSUE_TYPE_DEFAULT_trivial=Trivial issue (does not break functionality)
TRACKER_CATALOGUE_ISSUE_TYPE_DEFAULT_minor=Minor issue (breaks specific functionality)
TRACKER_CATALOGUE_ISSUE_TYPE_DEFAULT_major=Major issue (breaks an entire feature)
TRACKER_CATALOGUE_ISSUE_TYPE_DEFAULT_security=Security issue (exploit in the software)
DESCRIPTION_TRACKER_CATALOGUE_ADDON=The most relevant addon for this issue. Leave blank if not applicable or not listed. Use your best judgment; developers will fix this accordingly.
DESCRIPTION_TRACKER_CATALOGUE_DESCRIPTION=Describe the issue or feature in more detail. You can include screenshots in a comment post on the issue after you create it.
DESCRIPTION_TRACKER_CATALOGUE_VERSION=The version of the software of which the issue affects or is relevant (if applicable).
STEPS_TO_REPRODUCE=Steps to reproduce
DESCRIPTION_TRACKER_CATALOGUE_STEPS_TO_REPRODUCE=When applicable, describe how to reproduce this issue. Put one step per line.
ADDITIONAL_INFORMATION=Additional information
DESCRIPTION_TRACKER_CATALOGUE_ADDITIONAL_INFORMATION=Put any other relevant but less important information about the issue here. For example, put relavant system and software versions, or workarounds that you know to the issue.
HANDLER=Handling member
DESCRIPTION_TRACKER_CATALOGUE_HANDLER=The member assigned to handle / implement this issue (or a fix for the issue).
RELATED_TO=Related to
DESCRIPTION_TRACKER_CATALOGUE_RELATED_TO=Other issues to which this issue is related.
DESCRIPTION_TRACKER_CATALOGUE_STATUS=The current status of this issue.
TRACKER_CATALOGUE_STATUS_DEFAULT=open|information_needed|completed|closed_rejected|closed_nofix|closed_noreproduce|closed_duplicate|closed_nochange|closed_stale
TRACKER_CATALOGUE_STATUS_DEFAULT_open=Open
TRACKER_CATALOGUE_STATUS_DEFAULT_information_needed=Information Needed
TRACKER_CATALOGUE_STATUS_DEFAULT_completed=Completed
TRACKER_CATALOGUE_STATUS_DEFAULT_closed_rejected=Closed (rejected)
TRACKER_CATALOGUE_STATUS_DEFAULT_closed_nofix=Closed (not fixable)
TRACKER_CATALOGUE_STATUS_DEFAULT_closed_noreproduce=Closed (cannot reproduce)
TRACKER_CATALOGUE_STATUS_DEFAULT_closed_duplicate=Closed (duplicate)
TRACKER_CATALOGUE_STATUS_DEFAULT_closed_nochange=Closed (no changes needed)
TRACKER_CATALOGUE_STATUS_DEFAULT_closed_stale=Closed (stale)
HOTFIX=Hotfix
DESCRIPTION_TRACKER_CATALOGUE_HOTFIX=A resolved issue might include a Hotfix archive for those who need an immediate fix. You can go to <kbd>upgrader.php</kbd> and apply the Hotfix on the <kbd>Transfer over files</kbd> step.
IS_FUNDED=Funded?
DESCRIPTION_TRACKER_CATALOGUE_IS_FUNDED=Whether someone is financially funding the implementation of this issue. This effectively places the issue at high priority.
RELEASED_IN_VERSION=Released in version
DESCRIPTION_TRACKER_CATALOGUE_RELEASED_IN_VERSION=The software version in which the implementation of this issue was released.
TRACKER_CATALOGUE_IS_FUNDED_DEFAULT=0
TRACKER_CATALOGUE_CATEGORY_1=Core software / bundled addons
DESCRIPTION_TRACKER_CATALOGUE_CATEGORY_1=These issues pertain to the software's core code or bundled addons. They usually get highest priority. And implementations are included in software releases.
TRACKER_CATALOGUE_CATEGORY_2=Non-bundled addons and themes
DESCRIPTION_TRACKER_CATALOGUE_CATEGORY_2=These issues pertain to non-bundled addons and themes. They do not get as high of priority. And implementation is usually up to the addon's author and not the core developers. Implementations are not included in software releases; you have to manually update non-bundled addons from the addon author or from Admin Zone > Structure > Addons.
TRACKER_CATALOGUE_CATEGORY_3=Documentation and tutorials
DESCRIPTION_TRACKER_CATALOGUE_CATEGORY_3=These issues pertain to the software's documentation and tutorials, such as suggesting improvements or reporting inaccuracies.
TRACKER_CATALOGUE_CATEGORY_4=Homesite
DESCRIPTION_TRACKER_CATALOGUE_CATEGORY_4=These issues pertain specifically to the software's homesite.
TRACKER_CATALOGUE_CATEGORY_5=Alpha testing
DESCRIPTION_TRACKER_CATALOGUE_CATEGORY_5=These issues pertain to TODOs and workflows for testing upcoming software releases. Note that [tt]testing_platform[/tt] issues (e.g., fixing or adding tests) should go under "Non-bundled addons and themes". But workflows and TODOs pertaining to running the tests may be included in this category.
TRACKER_CATALOGUE_CATEGORY_6=Advocacy and Marketing
DESCRIPTION_TRACKER_CATALOGUE_CATEGORY_6=These issues pertain to promoting the software across the internet. They also pertain to the software's branding.
ISSUE_TAGS=Tags
DESCRIPTION_TRACKER_CATALOGUE_TAGS=A list of categorical tags explaining different properties of this issue (e.g., roadmap, risk, skills, types).

RESOLVING_TRACKER_ISSUES=Resolving tracker issues
REPORTING_TRACKER_ISSUES=Reporting tracker issues which get resolved
